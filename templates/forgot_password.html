{% extends "base.html" %}
{% block title %}Forgot Password (OTP) - Flourish Forge{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4 animate-in">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white text-center">
        <h4 class="mb-0">Password Recovery via Email OTP</h4>
        <small>Flourish Forge Portal</small>
      </div>
      <div class="card-body p-4">
        <form method="POST" class="mb-3">
          <input type="hidden" name="action" value="send_otp">
          <label class="form-label small fw-bold">Step 1: Registered Email Address</label>
          <div class="input-group">
            <input type="email" name="email" value="{{ email }}" class="form-control" required placeholder="Enter registered email">
            <button type="submit" class="btn btn-outline-primary">Send OTP</button>
          </div>
        </form>

        <hr>

        <form method="POST">
          <input type="hidden" name="action" value="reset_password">
          <label class="form-label small fw-bold">Step 2: Verify 6-Digit OTP &amp; Set New Password</label>
          <div class="mb-2">
            <input type="email" name="email" value="{{ email }}" class="form-control form-control-sm" required placeholder="Registered email">
          </div>
          <div class="mb-2">
            <input type="text" name="otp_code" maxlength="6" class="form-control form-control-sm" required placeholder="Enter 6-digit OTP">
          </div>
          <div class="mb-2">
            <input type="password" name="new_password" class="form-control form-control-sm" required placeholder="New Password (min 6 chars)">
          </div>
          <div class="mb-3">
            <input type="password" name="confirm_password" class="form-control form-control-sm" required placeholder="Confirm New Password">
          </div>
          <button type="submit" class="btn btn-success w-100">Verify OTP &amp; Update Password</button>
        </form>

        <div class="text-center mt-3">
          <a href="{{ url_for('login') }}" class="small text-decoration-none">&larr; Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
